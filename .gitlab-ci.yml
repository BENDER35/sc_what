stages:
  - test
  - release

default:
  image: python:3.12
  before_script:
    - python --version
    - pip install --upgrade pip

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  key:
    files:
      - requirements.txt
      - requirements-dev.txt
  paths:
    - .cache/pip

test:
  stage: test
  script:
    - pip install -e ".[dev]"
    - ruff check .
    - ruff format --check .
    - mypy group_finder.py
    - pytest --cov=group_finder --cov-report=term-missing
    - group-finder --version
    - group-finder --dry-run "python" -p telegram,discord --no-color
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

release:
  stage: release
  needs: ["test"]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  script:
    - |
      set -eu
      if [ -z "${GITLAB_RELEASE_TOKEN:-}" ]; then
        echo "Falta la variable CI GITLAB_RELEASE_TOKEN (scope api)."
        exit 1
      fi

      apt-get update -qq
      apt-get install -y -qq jq curl >/dev/null

      TAG="${CI_COMMIT_TAG}"
      PREFIX="sc_what-${TAG}"

      if git ls-tree -r --name-only "${TAG}" | grep -E '\.(csv|json|ndjson)$'; then
        echo "El tag ${TAG} contiene archivos de resultados; no se publicará."
        exit 1
      fi

      mkdir -p dist
      git archive --format=zip --prefix="${PREFIX}/" -o "dist/${PREFIX}.zip" "${TAG}"
      (cd dist && sha256sum "${PREFIX}.zip" > "${PREFIX}.zip.sha256")
      ls -lh dist

      API="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}"
      AUTH="PRIVATE-TOKEN: ${GITLAB_RELEASE_TOKEN}"

      if curl --silent --fail --header "${AUTH}" \
        "${API}/releases/${TAG}" >/dev/null; then
        echo "La release ${TAG} ya existe; no se vuelve a crear."
        exit 0
      fi

      upload() {
        curl --silent --show-error --fail \
          --header "${AUTH}" \
          --form "file=@$1" \
          "${API}/uploads" | jq -r '.full_path'
      }

      ZIP_PATH="$(upload "dist/${PREFIX}.zip")"
      SHA_PATH="$(upload "dist/${PREFIX}.zip.sha256")"
      ZIP_URL="${CI_SERVER_URL}${ZIP_PATH}"
      SHA_URL="${CI_SERVER_URL}${SHA_PATH}"
      echo "Zip subido: ${ZIP_URL}"
      echo "SHA subido: ${SHA_URL}"

      jq -n \
        --arg name "sc_what ${TAG}" \
        --arg tag "${TAG}" \
        --arg desc "Release automática de sc_what ${TAG}. Incluye el código fuente en zip y su checksum SHA-256." \
        --arg link_name "${PREFIX}.zip" \
        --arg link_url "${ZIP_URL}" \
        --arg sha_name "${PREFIX}.zip.sha256" \
        --arg sha_url "${SHA_URL}" \
        '{
          name: $name,
          tag_name: $tag,
          description: $desc,
          assets: {
            links: [
              { name: $link_name, url: $link_url, link_type: "package" },
              { name: $sha_name, url: $sha_url, link_type: "other" }
            ]
          }
        }' > release.json

      curl --silent --show-error --fail \
        --request POST \
        --header "${AUTH}" \
        --header "Content-Type: application/json" \
        --data @release.json \
        "${API}/releases" | jq -r '.tag_name + " -> " + ._links.self'
