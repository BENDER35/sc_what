[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sc-what"
version = "1.0.0"
description = "Buscador de enlaces de invitación públicos para WhatsApp, Signal, Teams, Discord y Telegram"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "BENDER35", email = "grandrodri3@gmail.com" }]
keywords = ["osint", "telegram", "discord", "whatsapp", "signal", "teams", "search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
    "ddgs>=9.14.4,<10",
    "httpx>=0.27,<1",
    "rich>=13.7,<16",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[project.scripts]
group-finder = "group_finder:main"

[project.urls]
Homepage = "https://github.com/BENDER35/sc_what"
Repository = "https://github.com/BENDER35/sc_what"
Mirror = "https://gitlab.com/BENDER_5000/sc_what"

[tool.setuptools]
py-modules = ["group_finder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
